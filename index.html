<!DOCTYPE html>
<html lang="fr" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TJBS - Tontine Journalière des Battants Solidaires</title>

    <!-- PWA: manifest + icônes + thème -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D1B2A">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="TJBS Mobile">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        tjbsGreen: '#2E7D32',
                        tjbsDarkGreen: '#1B5E20',
                        tjbsNavy: '#0D1B2A',
                        tjbsGold: '#D4AF37',
                        tjbsLightGold: '#F3E5AB'
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- SheetJS (xlsx) for Excel Import/Export -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        @media print {
            body * { visibility: hidden; }
            #printable-receipt, #printable-receipt * { visibility: visible; }
            #printable-receipt { position: absolute; left: 0; top: 0; width: 100%; }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 h-full flex flex-col overflow-hidden">
<!-- Écran de verrouillage PIN -->
<div id="lock-screen" style="position:fixed; inset:0; background:#0D1B2A; z-index:9999; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:20px;">
  <div style="width:64px; height:64px; background:white; border-radius:50%; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
    <img src="icon-96.png" alt="Logo TJBS" style="width:100%; height:100%; object-fit:contain; border-radius:50%;">
  </div>
  <h1 style="color:white; font-size:18px; font-weight:bold; margin-bottom:4px;">TJBS Mobile</h1>
  <p style="color:#D4AF37; font-size:12px; margin-bottom:24px;">Entrez votre code d'accès</p>
  <input type="password" id="pin-input" inputmode="numeric" maxlength="4" pattern="[0-9]*"
    style="width:160px; text-align:center; font-size:24px; letter-spacing:12px; padding:12px; border-radius:8px; border:none; margin-bottom:16px;"
    autofocus>
  <p id="pin-error" style="color:#ff6b6b; font-size:12px; height:16px;"></p>
  <button onclick="checkPin()" style="background:#2E7D32; color:white; padding:10px 32px; border-radius:8px; border:none; font-weight:bold; margin-top:8px;">
    Déverrouiller
  </button>
</div>

<script>
  const CORRECT_PIN = "4321";

  function checkPin() {
    const entered = document.getElementById('pin-input').value;
    if (entered === CORRECT_PIN) {
      document.getElementById('lock-screen').style.display = 'none';
      sessionStorage.setItem('tjbs-unlocked', 'true');
    } else {
      document.getElementById('pin-error').textContent = 'Code incorrect';
      document.getElementById('pin-input').value = '';
    }
  }

  // Permet de valider avec la touche Entrée
  document.addEventListener('DOMContentLoaded', () => {
    // Si déjà déverrouillé dans cette session, on saute l'écran
    if (sessionStorage.getItem('tjbs-unlocked') === 'true') {
      document.getElementById('lock-screen').style.display = 'none';
    }
    document.getElementById('pin-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') checkPin();
    });
  });
</script>
    <!-- App Header -->
    <header class="bg-tjbsNavy text-white shadow-md z-20 flex-shrink-0">
        <div class="max-w-md mx-auto px-4 py-3 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <!-- TJBS Logo (fichier réel) -->
                <div class="w-11 h-11 bg-white rounded-full flex items-center justify-center p-0.5 shadow-inner border-2 border-tjbsGold flex-shrink-0 overflow-hidden">
                    <img src="icon-96.png" alt="Logo TJBS" class="w-full h-full object-contain rounded-full">
                </div>
                <div>
                    <h1 class="text-sm font-bold tracking-tight leading-tight">TJBS MOBILE</h1>
                    <p class="text-[10px] text-tjbsLightGold tracking-wide">Épargner • S'entraider • Avancer</p>
                </div>
            </div>
            <div class="flex items-center space-x-2">
                <button onclick="window.tjbsAppInstance.openSettingsModal()" class="w-9 h-9 bg-gray-800 rounded-full flex items-center justify-center text-tjbsGold hover:bg-gray-700 transition" title="Paramètres & Cycle">
                    <i class="fa-solid fa-gear text-sm"></i>
                </button>
                <button id="install-btn" onclick="window.tjbsAppInstance.openInstallPrompt()" class="w-9 h-9 bg-tjbsGreen rounded-full flex items-center justify-center text-white hover:bg-tjbsDarkGreen transition hidden" title="Installer l'application">
                    <i class="fa-solid fa-download text-sm"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main id="app-view" class="flex-1 overflow-y-auto pb-20 relative max-w-md mx-auto w-full bg-white shadow-sm">
        <!-- Views will be dynamically injected here -->
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bg-white border-t border-gray-200 fixed bottom-0 left-0 right-0 z-30 max-w-md mx-auto shadow-lg">
        <div class="grid grid-cols-5 h-16">
            <button onclick="window.tjbsAppInstance.switchTab('dashboard')" id="nav-dashboard" class="flex flex-col items-center justify-center text-gray-500 hover:text-tjbsGreen transition">
                <i class="fa-solid fa-chart-pie text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Bilan</span>
            </button>
            <button onclick="window.tjbsAppInstance.switchTab('members')" id="nav-members" class="flex flex-col items-center justify-center text-gray-500 hover:text-tjbsGreen transition">
                <i class="fa-solid fa-users text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Membres</span>
            </button>
            <button onclick="window.tjbsAppInstance.switchTab('daily')" id="nav-daily" class="flex flex-col items-center justify-center text-gray-500 hover:text-tjbsGreen transition">
                <i class="fa-solid fa-calendar-check text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Saisie</span>
            </button>
            <button onclick="window.tjbsAppInstance.switchTab('beneficiaries')" id="nav-beneficiaries" class="flex flex-col items-center justify-center text-gray-500 hover:text-tjbsGreen transition">
                <i class="fa-solid fa-utensils text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Bouffes</span>
            </button>
            <button onclick="window.tjbsAppInstance.switchTab('fines')" id="nav-fines" class="flex flex-col items-center justify-center text-gray-500 hover:text-tjbsGreen transition">
                <i class="fa-solid fa-triangle-exclamation text-lg mb-0.5"></i>
                <span class="text-[10px] font-medium">Retards</span>
            </button>
        </div>
    </nav>

    <!-- Modals Container -->
    <div id="modal-container" class="fixed inset-0 bg-black/60 z-50 hidden flex items-center justify-center p-4">
        <div id="modal-content" class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-y-auto shadow-2xl p-6 relative">
            <!-- Dynamic Modal Content -->
        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed top-5 left-1/2 transform -translate-x-1/2 bg-tjbsNavy text-white px-4 py-2.5 rounded-xl shadow-xl z-50 text-xs font-medium opacity-0 pointer-events-none transition-all duration-300 flex items-center space-x-2">
        <i class="fa-solid fa-circle-info text-tjbsGold"></i>
        <span id="toast-message">Message</span>
    </div>

    <script>
        const DEFAULT_PARAMS = {
            durationDays: 30,
            valNom: 1000,
            valDemiNom: 500,
            bouffeNom: 29500,
            bouffeDemiNom: 14750,
            fraisNom: 500,
            fraisDemiNom: 250,
            startDate: '2026-08-10',
            endDate: '2026-09-08',
            maxMembers: 300,
            amendeAvant: 500,
            amendeApres: 700,
            managerPassword: 'tjbs2026password',
            currentCycle: 1,
            cycleClosed: false
        };

        class TJBSApp {
            constructor() {
                this.state = {
                    currentTab: 'dashboard',
                    params: { ...DEFAULT_PARAMS },
                    members: [],
                    dailyContributions: {}, 
                    beneficiarySchedule: [], 
                    receipts: [],
                    selectedDay: '2026-08-10'
                };
                this.memberSearchQuery = '';
                this.deferredInstallPrompt = null;
                this.init();
            }

            async init() {
                this.loadFromLocalStorage();
                if (this.state.members.length === 0) {
                    this.loadDefaultSeedData();
                }
                this.switchTab('dashboard');
                this.registerServiceWorker();
                this.setupInstallPromptListener();
            }

            registerServiceWorker() {
                if ('serviceWorker' in navigator) {
                    window.addEventListener('load', () => {
                        navigator.serviceWorker.register('service-worker.js')
                            .then((reg) => console.log('Service worker enregistré :', reg.scope))
                            .catch((err) => console.warn('Échec enregistrement service worker :', err));
                    });
                }
            }

            setupInstallPromptListener() {
                window.addEventListener('beforeinstallprompt', (e) => {
                    e.preventDefault();
                    this.deferredInstallPrompt = e;
                    const btn = document.getElementById('install-btn');
                    if (btn) btn.classList.remove('hidden');
                });
                window.addEventListener('appinstalled', () => {
                    this.deferredInstallPrompt = null;
                    const btn = document.getElementById('install-btn');
                    if (btn) btn.classList.add('hidden');
                    this.showToast('Application TJBS installée avec succès !');
                });
            }

            loadFromLocalStorage() {
                const saved = localStorage.getItem('tjbs_app_state_v1');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        this.state = { ...this.state, ...parsed };
                    } catch (e) {
                        console.error("Error loading local storage", e);
                    }
                }
            }

            saveToLocalStorage() {
                localStorage.setItem('tjbs_app_state_v1', JSON.stringify(this.state));
            }

            loadDefaultSeedData() {
                const sampleNames = [
                    ["Kamga", "Jean-Paul"], ["Njoya", "Aichatou"], ["Fomba", "Emmanuel"], 
                    ["Tientcheu", "Marie-Claire"], ["Bationo", "Salif"], ["Kone", "Aminata"],
                    ["Nkomo", "David"], ["Zongo", "Bintou"], ["Ouedraogo", "Ibrahim"], ["Traore", "Fatoumata"],
                    ["Sango", "Christian"], ["Dassi", "Madeleine"], ["Tagne", "Hervé"], ["Mpeck", "Suzanne"],
                    ["Kiyindou", "Blaise"], ["Eboutou", "Chantal"], ["Nguessan", "Kouassi"], ["Diallo", "Mamadou"],
                    ["Sow", "Aissatou"], ["Bella", "Pauline"], ["Mvondo", "Gilles"], ["Essomba", "Lucie"],
                    ["Abega", "Theophile"], ["Ngono", "Bernadette"], ["Biloa", "Celestin"], ["Mballa", "Therese"],
                    ["Atangana", "Raymond"], ["Biloa", "Rosalie"], ["Etoa", "Maurice"], ["Ntsama", "Gertrude"]
                ];

                this.state.members = sampleNames.map((n, index) => {
                    const id = `MEM-${101 + index}`;
                    const nbNoms = (index % 5 === 0) ? 0 : 1;
                    const nbDemiNoms = nbNoms === 0 ? 1 : 0;
                    return {
                        id,
                        nom: n[0],
                        prenom: n[1],
                        telephone: `+237 6${Math.floor(20000000 + Math.random() * 79999999)}`,
                        quartier: ['Akwa', 'Bonanjo', 'Brazza', 'Mvog-Mbi', 'Elig-Essono', 'Nkomkana', 'Makepe'][index % 7],
                        nbNoms,
                        nbDemiNoms,
                        statut: 'Actif'
                    };
                });

                this.state.beneficiarySchedule = [];
                const startDate = new Date(this.state.params.startDate);
                for (let i = 1; i <= 30; i++) {
                    const d = new Date(startDate);
                    d.setDate(d.getDate() + (i - 1));
                    const dateStr = d.toISOString().split('T')[0];
                    const member = this.state.members[(i - 1) % this.state.members.length];
                    const montantBouffe = (member.nbNoms * this.state.params.bouffeNom) + (member.nbDemiNoms * this.state.params.bouffeDemiNom);
                    
                    this.state.beneficiarySchedule.push({
                        tour: i,
                        date: dateStr,
                        memberId: member.id,
                        montantBouffe,
                        statut: i <= 5 ? 'Après bouffe' : 'Avant bouffe',
                        amendeDeduite: 0,
                        netAVerser: montantBouffe
                    });
                }

                this.state.dailyContributions = {};
                this.state.members.forEach(m => {
                    this.state.dailyContributions[m.id] = {};
                    const dailyRate = (m.nbNoms * this.state.params.valNom) + (m.nbDemiNoms * this.state.params.valDemiNom);
                    const startD = new Date(this.state.params.startDate);
                    for(let d=0; d<15; d++) {
                        const cur = new Date(startD);
                        cur.setDate(cur.getDate() + d);
                        const ds = cur.toISOString().split('T')[0];
                        if (Math.random() > 0.15) {
                            this.state.dailyContributions[m.id][ds] = dailyRate;
                        } else {
                            this.state.dailyContributions[m.id][ds] = 0;
                        }
                    }
                });

                this.saveToLocalStorage();
            }

            showToast(message) {
                const toast = document.getElementById('toast');
                document.getElementById('toast-message').innerText = message;
                toast.classList.remove('opacity-0', 'pointer-events-none');
                setTimeout(() => {
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 3000);
            }

            switchTab(tab) {
                this.state.currentTab = tab;
                ['dashboard', 'members', 'daily', 'beneficiaries', 'fines'].forEach(t => {
                    const btn = document.getElementById(`nav-${t}`);
                    if(btn) {
                        if(t === tab) {
                            btn.classList.add('text-tjbsGreen');
                            btn.classList.remove('text-gray-500');
                        } else {
                            btn.classList.remove('text-tjbsGreen');
                            btn.classList.add('text-gray-500');
                        }
                    }
                });
                this.renderCurrentView();
            }

            renderCurrentView() {
                const container = document.getElementById('app-view');
                switch(this.state.currentTab) {
                    case 'dashboard':
                        container.innerHTML = this.renderDashboardView();
                        break;
                    case 'members':
                        container.innerHTML = this.renderMembersView();
                        break;
                    case 'daily':
                        container.innerHTML = this.renderDailyView();
                        break;
                    case 'beneficiaries':
                        container.innerHTML = this.renderBeneficiariesView();
                        break;
                    case 'fines':
                        container.innerHTML = this.renderFinesView();
                        break;
                    default:
                        container.innerHTML = this.renderDashboardView();
                        break;
                }
            }

            getDatesList() {
                const list = [];
                const start = new Date(this.state.params.startDate);
                for(let i=0; i<this.state.params.durationDays; i++) {
                    const d = new Date(start);
                    d.setDate(d.getDate() + i);
                    list.push(d.toISOString().split('T')[0]);
                }
                return list;
            }

            getMemberStats(memberId) {
                const member = this.state.members.find(m => m.id === memberId);
                if (!member) return {};
                const dailyRate = (member.nbNoms * this.state.params.valNom) + (member.nbDemiNoms * this.state.params.valDemiNom);
                const totalToContribute = dailyRate * this.state.params.durationDays;
                
                const memberContributions = this.state.dailyContributions[memberId] || {};
                let totalPaid = 0;
                let misses = 0;
                const dates = this.getDatesList();
                const todayStr = new Date().toISOString().split('T')[0];

                dates.forEach(d => {
                    if (d <= todayStr) {
                        const paid = memberContributions[d];
                        if (paid === undefined || paid === 0) {
                            misses++;
                        } else {
                            totalPaid += paid;
                        }
                    }
                });

                const balanceRemaining = Math.max(0, totalToContribute - totalPaid);
                const sched = this.state.beneficiarySchedule.find(s => s.memberId === memberId);
                let applicableFineRate = this.state.params.amendeAvant;
                if (sched && sched.statut === 'Après bouffe') {
                    applicableFineRate = this.state.params.amendeApres;
                }
                const totalFine = misses * applicableFineRate;
                const recoveryRate = totalToContribute > 0 ? Math.min(100, Math.round((totalPaid / totalToContribute) * 100)) : 0;

                return {
                    dailyRate,
                    totalToContribute,
                    totalPaid,
                    balanceRemaining,
                    misses,
                    totalFine,
                    recoveryRate,
                    schedTour: sched ? sched.tour : '-'
                };
            }

            renderDashboardView() {
                let totalCollected = 0;
                let totalExpected = 0;
                let totalMisses = 0;
                let totalFines = 0;

                this.state.members.forEach(m => {
                    const stats = this.getMemberStats(m.id);
                    totalCollected += stats.totalPaid;
                    totalExpected += stats.totalToContribute;
                    totalMisses += stats.misses;
                    totalFines += stats.totalFine;
                });

                const activeMembers = this.state.members.filter(m => m.statut === 'Actif').length;
                const overallRate = totalExpected > 0 ? Math.round((totalCollected / totalExpected) * 100) : 0;

                return `
                <div class="p-4 space-y-4">
                    <div class="bg-gradient-to-r from-tjbsNavy to-gray-900 text-white p-4 rounded-2xl shadow-md flex justify-between items-center">
                        <div>
                            <span class="bg-tjbsGold text-tjbsNavy font-bold text-[10px] px-2 py-0.5 rounded-full uppercase">Cycle ${this.state.params.currentCycle}</span>
                            <h2 class="text-lg font-bold mt-1">Bilan Général TJBS</h2>
                            <p class="text-xs text-gray-300">Du ${this.state.params.startDate} au ${this.state.params.endDate}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-2xl font-extrabold text-tjbsGold">${overallRate}%</span>
                            <p class="text-[10px] text-gray-300">Recouvrement</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl shadow-sm">
                            <div class="flex items-center space-x-2 text-tjbsGreen mb-1">
                                <i class="fa-solid fa-wallet text-sm"></i>
                                <span class="text-xs font-semibold uppercase tracking-wider">Total Cotisé</span>
                            </div>
                            <p class="text-lg font-bold text-gray-900">${totalCollected.toLocaleString()} <span class="text-xs font-normal">FCFA</span></p>
                            <p class="text-[10px] text-gray-500 mt-0.5">Objectif: ${totalExpected.toLocaleString()} FCFA</p>
                        </div>

                        <div class="bg-amber-50 border border-amber-200 p-3.5 rounded-xl shadow-sm">
                            <div class="flex items-center space-x-2 text-amber-700 mb-1">
                                <i class="fa-solid fa-users text-sm"></i>
                                <span class="text-xs font-semibold uppercase tracking-wider">Membres Actifs</span>
                            </div>
                            <p class="text-lg font-bold text-gray-900">${activeMembers} <span class="text-xs font-normal">/ ${this.state.members.length}</span></p>
                            <p class="text-[10px] text-gray-500 mt-0.5">Max 300 autorisés</p>
                        </div>

                        <div class="bg-rose-50 border border-rose-200 p-3.5 rounded-xl shadow-sm">
                            <div class="flex items-center space-x-2 text-rose-700 mb-1">
                                <i class="fa-solid fa-circle-xmark text-sm"></i>
                                <span class="text-xs font-semibold uppercase tracking-wider">Total Échecs</span>
                            </div>
                            <p class="text-lg font-bold text-gray-900">${totalMisses} <span class="text-xs font-normal">jours</span></p>
                            <p class="text-[10px] text-gray-500 mt-0.5">Non payés cumulés</p>
                        </div>

                        <div class="bg-purple-50 border border-purple-200 p-3.5 rounded-xl shadow-sm">
                            <div class="flex items-center space-x-2 text-purple-700 mb-1">
                                <i class="fa-solid fa-file-invoice-dollar text-sm"></i>
                                <span class="text-xs font-semibold uppercase tracking-wider">Total Amendes</span>
                            </div>
                            <p class="text-lg font-bold text-gray-900">${totalFines.toLocaleString()} <span class="text-xs font-normal">FCFA</span></p>
                            <p class="text-[10px] text-gray-500 mt-0.5">Avant/Après bouffe</p>
                        </div>
                    </div>

                    <div class="bg-white border border-gray-200 rounded-2xl p-4 shadow-sm space-y-3">
                        <h3 class="text-xs font-bold uppercase text-gray-500 tracking-wider">Actions Rapides & Gestion</h3>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="window.tjbsAppInstance.switchTab('daily')" class="bg-tjbsGreen text-white py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 shadow hover:bg-tjbsDarkGreen transition">
                                <i class="fa-solid fa-pen-to-square"></i>
                                <span>Saisie du Jour</span>
                            </button>
                            <button onclick="window.tjbsAppInstance.exportExcelCycle()" class="bg-tjbsNavy text-white py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 shadow hover:bg-gray-800 transition">
                                <i class="fa-solid fa-file-excel text-tjbsGold"></i>
                                <span>Exporter Cycle (.xlsx)</span>
                            </button>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <button onclick="window.tjbsAppInstance.triggerImportModal()" class="bg-gray-100 text-gray-700 py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 hover:bg-gray-200 transition">
                                <i class="fa-solid fa-file-arrow-up text-tjbsGreen"></i>
                                <span>Importer Fichier</span>
                            </button>
                            <button onclick="window.tjbsAppInstance.promptCloseCycle()" class="bg-amber-100 text-amber-800 py-2.5 px-3 rounded-xl text-xs font-semibold flex items-center justify-center space-x-2 hover:bg-amber-200 transition">
                                <i class="fa-solid fa-flag-checkered"></i>
                                <span>Clôturer Cycle</span>
                            </button>
                        </div>
                    </div>
                </div>`;
            }

            renderMembersView() {
                const search = (this.memberSearchQuery || '').toLowerCase();
                const filtered = this.state.members.filter(m => 
                    m.nom.toLowerCase().includes(search) || 
                    m.prenom.toLowerCase().includes(search) || 
                    m.telephone.includes(search) ||
                    m.id.toLowerCase().includes(search)
                );

                return `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-base font-bold text-gray-900">Gestion des Membres</h2>
                            <p class="text-xs text-gray-500">${this.state.members.length} inscrits (Max 300)</p>
                        </div>
                        <button onclick="window.tjbsAppInstance.openMemberModal()" class="bg-tjbsGreen text-white px-3 py-2 rounded-xl text-xs font-semibold shadow hover:bg-tjbsDarkGreen transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-user-plus"></i>
                            <span>Nouveau</span>
                        </button>
                    </div>

                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-gray-400">
                            <i class="fa-solid fa-magnifying-glass text-xs"></i>
                        </span>
                        <input type="text" oninput="window.tjbsAppInstance.filterMembers(this.value)" value="${this.memberSearchQuery || ''}" placeholder="Rechercher par nom, prénom, téléphone..." class="w-full pl-9 pr-4 py-2.5 bg-gray-100 border border-gray-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-tjbsGreen">
                    </div>

                    <div class="space-y-2.5 max-h-[calc(100vh-250px)] overflow-y-auto no-scrollbar">
                        ${filtered.length === 0 ? `<p class="text-center text-xs text-gray-400 py-8">Aucun membre trouvé</p>` : ''}
                        ${filtered.map(m => {
                            const stats = this.getMemberStats(m.id);
                            return `
                            <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-10 h-10 rounded-full bg-tjbsNavy text-tjbsGold font-bold flex items-center justify-center text-xs flex-shrink-0">
                                        ${m.nom.substring(0,2).toUpperCase()}
                                    </div>
                                    <div>
                                        <div class="flex items-center space-x-2">
                                            <h4 class="text-xs font-bold text-gray-900">${m.nom} ${m.prenom}</h4>
                                            <span class="text-[9px] px-1.5 py-0.5 rounded-full ${m.statut==='Actif'?'bg-emerald-100 text-emerald-800':'bg-gray-100 text-gray-600'}">${m.statut}</span>
                                        </div>
                                        <p class="text-[11px] text-gray-500">${m.telephone} • ${m.quartier}</p>
                                        <div class="flex items-center space-x-2 mt-1 text-[10px] text-gray-600">
                                            <span class="bg-blue-50 text-blue-700 px-1.5 py-0.5 rounded font-medium">${m.nbNoms} Nom(s) / ${m.nbDemiNoms} Demi</span>
                                            <span class="text-emerald-700 font-semibold">${stats.totalPaid || 0} F payés</span>
                                        </div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-1">
                                    <button onclick="window.tjbsAppInstance.openMemberModal('${m.id}')" class="p-2 text-gray-400 hover:text-tjbsGreen transition" title="Modifier">
                                        <i class="fa-solid fa-pen text-xs"></i>
                                    </button>
                                    <button onclick="window.tjbsAppInstance.deleteMember('${m.id}')" class="p-2 text-gray-400 hover:text-rose-600 transition" title="Supprimer">
                                        <i class="fa-solid fa-trash text-xs"></i>
                                    </button>
                                </div>
                            `;
                        }).join('')}
                    </div>
                </div>`;
            }

            filterMembers(val) {
                this.memberSearchQuery = val;
                const container = document.getElementById('app-view');
                container.innerHTML = this.renderMembersView();
                const input = container.querySelector('input');
                if (input) {
                    input.focus();
                    input.setSelectionRange(input.value.length, input.value.length);
                }
            }

            renderDailyView() {
                const dates = this.getDatesList();
                if (!this.state.selectedDay || !dates.includes(this.state.selectedDay)) {
                    this.state.selectedDay = dates[0];
                }

                const currentDayIndex = dates.indexOf(this.state.selectedDay);
                const activeMembers = this.state.members.filter(m => m.statut === 'Actif');

                let dayCollected = 0;
                activeMembers.forEach(m => {
                    const amt = this.state.dailyContributions[m.id]?.[this.state.selectedDay] || 0;
                    dayCollected += amt;
                });

                return `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-base font-bold text-gray-900">Saisie des Cotisations</h2>
                            <p class="text-xs text-gray-500">Jour ${currentDayIndex + 1} sur ${this.state.params.durationDays}</p>
                        </div>
                        <div class="bg-emerald-50 border border-emerald-200 px-3 py-1 rounded-xl text-right">
                            <span class="text-[10px] text-emerald-700 block">Total du jour</span>
                            <span class="text-xs font-bold text-emerald-900">${dayCollected.toLocaleString()} FCFA</span>
                        </div>
                    </div>

                    <div class="flex items-center space-x-2 bg-gray-100 p-2 rounded-xl">
                        <button onclick="window.tjbsAppInstance.changeDay(-1)" class="w-8 h-8 bg-white rounded-lg shadow-sm flex items-center justify-center text-gray-700 hover:bg-gray-200">
                            <i class="fa-solid fa-chevron-left text-xs"></i>
                        </button>
                        <select onchange="window.tjbsAppInstance.selectDay(this.value)" class="flex-1 bg-white border border-gray-200 rounded-lg py-1.5 px-2 text-xs font-medium text-gray-800 focus:outline-none">
                            ${dates.map((d, idx) => `
                                <option value="${d}" ${d === this.state.selectedDay ? 'selected' : ''}>Jour ${idx + 1} — ${d}</option>
                            `).join('')}
                        </select>
                        <button onclick="window.tjbsAppInstance.changeDay(1)" class="w-8 h-8 bg-white rounded-lg shadow-sm flex items-center justify-center text-gray-700 hover:bg-gray-200">
                            <i class="fa-solid fa-chevron-right text-xs"></i>
                        </button>
                    </div>

                    <div class="flex items-center justify-between bg-blue-50 border border-blue-200 p-2.5 rounded-xl">
                        <span class="text-xs text-blue-900 font-medium">Action rapide du jour :</span>
                        <div class="space-x-1">
                            <button onclick="window.tjbsAppInstance.markAllToday(true)" class="bg-tjbsGreen text-white text-[11px] px-2.5 py-1 rounded-lg font-semibold hover:bg-tjbsDarkGreen">Tout solder</button>
                            <button onclick="window.tjbsAppInstance.markAllToday(false)" class="bg-rose-600 text-white text-[11px] px-2.5 py-1 rounded-lg font-semibold hover:bg-rose-700">Tout vider</button>
                        </div>
                    </div>

                    <div class="space-y-2 max-h-[calc(100vh-310px)] overflow-y-auto no-scrollbar">
                        ${activeMembers.map(m => {
                            const dailyRate = (m.nbNoms * this.state.params.valNom) + (m.nbDemiNoms * this.state.params.valDemiNom);
                            const paidAmt = this.state.dailyContributions[m.id]?.[this.state.selectedDay];
                            const isPaid = paidAmt !== undefined && paidAmt > 0;
                            const isMissed = paidAmt === 0;

                            return `
                            <div class="bg-white border ${isPaid ? 'border-emerald-300 bg-emerald-50/20' : (isMissed ? 'border-rose-300 bg-rose-50/20' : 'border-gray-200')} rounded-xl p-3 shadow-sm flex items-center justify-between">
                                <div class="flex items-center space-x-3">
                                    <div class="w-8 h-8 rounded-full ${isPaid ? 'bg-emerald-600 text-white' : (isMissed ? 'bg-rose-600 text-white' : 'bg-gray-200 text-gray-600')} font-bold flex items-center justify-center text-[11px] flex-shrink-0">
                                        ${isPaid ? '<i class="fa-solid fa-check"></i>' : (isMissed ? '<i class="fa-solid fa-xmark"></i>' : m.nom[0])}
                                    </div>
                                    <div>
                                        <h4 class="text-xs font-bold text-gray-900">${m.nom} ${m.prenom}</h4>
                                        <p class="text-[10px] text-gray-500">Attendu: ${dailyRate.toLocaleString()} FCFA</p>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2">
                                    <input type="number" 
                                        value="${paidAmt !== undefined ? paidAmt : ''}" 
                                        placeholder="${dailyRate}"
                                        onchange="window.tjbsAppInstance.updateContribution('${m.id}', '${this.state.selectedDay}', this.value)"
                                        class="w-24 bg-gray-100 border border-gray-300 rounded-lg px-2 py-1.5 text-xs text-right font-bold focus:bg-white focus:ring-2 focus:ring-tjbsGreen focus:outline-none">
                                    <button onclick="window.tjbsAppInstance.updateContribution('${m.id}', '${this.state.selectedDay}', ${dailyRate})" class="bg-emerald-100 text-emerald-800 p-1.5 rounded-lg text-xs hover:bg-emerald-200" title="Mettre le montant exact">
                                        <i class="fa-solid fa-check"></i>
                                    </button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            selectDay(dayStr) {
                this.state.selectedDay = dayStr;
                this.renderCurrentView();
            }

            changeDay(offset) {
                const dates = this.getDatesList();
                const idx = dates.indexOf(this.state.selectedDay);
                const newIdx = Math.max(0, Math.min(dates.length - 1, idx + offset));
                this.state.selectedDay = dates[newIdx];
                this.renderCurrentView();
            }

            updateContribution(memberId, dayStr, val) {
                if (!this.state.dailyContributions[memberId]) {
                    this.state.dailyContributions[memberId] = {};
                }
                const num = val === '' ? 0 : parseFloat(val);
                this.state.dailyContributions[memberId][dayStr] = isNaN(num) ? 0 : num;
                this.saveToLocalStorage();
                this.renderCurrentView();
                this.showToast('Cotisation enregistrée');
            }

            markAllToday(sold) {
                const activeMembers = this.state.members.filter(m => m.statut === 'Actif');
                activeMembers.forEach(m => {
                    if (!this.state.dailyContributions[m.id]) {
                        this.state.dailyContributions[m.id] = {};
                    }
                    const dailyRate = (m.nbNoms * this.state.params.valNom) + (m.nbDemiNoms * this.state.params.valDemiNom);
                    this.state.dailyContributions[m.id][this.state.selectedDay] = sold ? dailyRate : 0;
                });
                this.saveToLocalStorage();
                this.renderCurrentView();
                this.showToast(sold ? 'Toutes les cotisations du jour soldées' : 'Toutes les cotisations du jour vidées');
            }

            renderBeneficiariesView() {
                return `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-base font-bold text-gray-900">Ordre des Bénéficiaires</h2>
                            <p class="text-xs text-gray-500">Planification des 30 tours de bouffe</p>
                        </div>
                        <button onclick="window.tjbsAppInstance.autoAssignBeneficiaries()" class="bg-tjbsNavy text-white px-3 py-2 rounded-xl text-xs font-semibold shadow hover:bg-gray-800 transition flex items-center space-x-1.5">
                            <i class="fa-solid fa-wand-magic-sparkles text-tjbsGold"></i>
                            <span>Répartir</span>
                        </button>
                    </div>

                    <div class="space-y-2.5 max-h-[calc(100vh-220px)] overflow-y-auto no-scrollbar">
                        ${this.state.beneficiarySchedule.map((item, index) => {
                            const member = this.state.members.find(m => m.id === item.memberId) || { nom: 'Non assigné', prenom: '' };
                            const stats = item.memberId ? this.getMemberStats(item.memberId) : { totalFine: 0 };
                            const amendeDeduite = item.amendeDeduite !== undefined ? item.amendeDeduite : (stats.totalFine || 0);
                            const netAVerser = item.montantBouffe - amendeDeduite;

                            return `
                            <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm space-y-2">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-2">
                                        <span class="w-7 h-7 bg-tjbsGold text-tjbsNavy font-bold rounded-lg flex items-center justify-center text-xs">#${item.tour}</span>
                                        <div>
                                            <h4 class="text-xs font-bold text-gray-900">${member.nom} ${member.prenom}</h4>
                                            <p class="text-[10px] text-gray-500">Date prévue : ${item.date}</p>
                                        </div>
                                    </div>
                                    <span class="text-[10px] px-2 py-0.5 rounded-full ${item.statut === 'Avant bouffe' ? 'bg-amber-100 text-amber-800' : 'bg-emerald-100 text-emerald-800'}">${item.statut}</span>
                                </div>

                                <div class="grid grid-cols-3 gap-2 bg-gray-50 p-2 rounded-lg text-center text-[10px]">
                                    <div>
                                        <span class="text-gray-500 block">Bouffe</span>
                                        <span class="font-bold text-gray-900">${item.montantBouffe.toLocaleString()} F</span>
                                    </div>
                                    <div>
                                        <span class="text-gray-500 block">Amende déduite</span>
                                        <span class="font-bold text-rose-600">-${amendeDeduite.toLocaleString()} F</span>
                                    </div>
                                    <div>
                                        <span class="text-gray-500 block">Net à verser</span>
                                        <span class="font-bold text-tjbsGreen">${netAVerser.toLocaleString()} F</span>
                                    </div>
                                </div>

                                <div class="flex items-center justify-end space-x-2 pt-1">
                                    <select onchange="window.tjbsAppInstance.updateBeneficiaryStatus(${index}, this.value)" class="bg-gray-100 border border-gray-200 rounded-lg px-2 py-1 text-[10px] text-gray-700 focus:outline-none">
                                        <option value="Avant bouffe" ${item.statut==='Avant bouffe'?'selected':''}>Avant bouffe</option>
                                        <option value="Après bouffe" ${item.statut==='Après bouffe'?'selected':''}>Après bouffe</option>
                                    </select>
                                    <button onclick="window.tjbsAppInstance.generateReceiptModal(${index})" class="bg-tjbsNavy text-white px-3 py-1.5 rounded-lg text-[10px] font-semibold flex items-center space-x-1 hover:bg-gray-800 transition">
                                        <i class="fa-solid fa-receipt text-tjbsGold"></i>
                                        <span>Reçu</span>
                                    </button>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            updateBeneficiaryStatus(index, statut) {
                this.state.beneficiarySchedule[index].statut = statut;
                this.saveToLocalStorage();
                this.renderCurrentView();
                this.showToast('Statut mis à jour');
            }

            autoAssignBeneficiaries() {
                const active = this.state.members.filter(m => m.statut === 'Actif');
                if (active.length === 0) {
                    this.showToast('Aucun membre actif disponible');
                    return;
                }
                this.state.beneficiarySchedule.forEach((item, idx) => {
                    const m = active[idx % active.length];
                    item.memberId = m.id;
                    item.montantBouffe = (m.nbNoms * this.state.params.bouffeNom) + (m.nbDemiNoms * this.state.params.bouffeDemiNom);
                });
                this.saveToLocalStorage();
                this.renderCurrentView();
                this.showToast('Bénéficiaires répartis automatiquement');
            }

            renderFinesView() {
                const membersWithFines = this.state.members.map(m => {
                    const stats = this.getMemberStats(m.id);
                    return { member: m, stats };
                }).filter(item => item.stats.misses > 0);

                let totalFinesGlobal = 0;
                membersWithFines.forEach(item => totalFinesGlobal += item.stats.totalFine);

                return `
                <div class="p-4 space-y-4">
                    <div class="flex items-center justify-between">
                        <div>
                            <h2 class="text-base font-bold text-gray-900">Récapitulatif Retards & Amendes</h2>
                            <p class="text-xs text-gray-500">Membres en situation d'impayé</p>
                        </div>
                        <div class="bg-rose-50 border border-rose-200 px-3 py-1 rounded-xl text-right">
                            <span class="text-[10px] text-rose-700 block">Total Amendes</span>
                            <span class="text-xs font-bold text-rose-900">${totalFinesGlobal.toLocaleString()} FCFA</span>
                        </div>
                    </div>

                    <div class="space-y-2.5 max-h-[calc(100vh-220px)] overflow-y-auto no-scrollbar">
                        ${membersWithFines.length === 0 ? `<p class="text-center text-xs text-gray-400 py-8">Aucun retard enregistré ! Excellent.</p>` : ''}
                        ${membersWithFines.map(({ member, stats }) => {
                            const sched = this.state.beneficiarySchedule.find(s => s.memberId === member.id);
                            const statusBouffe = sched ? sched.statut : 'Avant bouffe';
                            const rateUsed = statusBouffe === 'Après bouffe' ? this.state.params.amendeApres : this.state.params.amendeAvant;

                            return `
                            <div class="bg-white border border-gray-200 rounded-xl p-3 shadow-sm space-y-2">
                                <div class="flex items-center justify-between">
                                    <div class="flex items-center space-x-2">
                                        <div class="w-8 h-8 rounded-full bg-rose-100 text-rose-700 font-bold flex items-center justify-center text-xs">
                                            ${stats.misses}
                                        </div>
                                        <div>
                                            <h4 class="text-xs font-bold text-gray-900">${member.nom} ${member.prenom}</h4>
                                            <p class="text-[10px] text-gray-500">${member.telephone}</p>
                                        </div>
                                    </div>
                                    <span class="text-[10px] bg-rose-50 text-rose-700 font-bold px-2 py-0.5 rounded-full">${stats.totalFine.toLocaleString()} F</span>
                                </div>
                                <div class="flex items-center justify-between text-[10px] bg-gray-50 p-2 rounded-lg text-gray-600">
                                    <span>Taux amende : ${rateUsed} F / échec (${statusBouffe})</span>
                                    <span>Tour bouffe : #${stats.schedTour}</span>
                                </div>
                            </div>`;
                        }).join('')}
                    </div>
                </div>`;
            }

            generateReceiptModal(tourIndex) {
                const item = this.state.beneficiarySchedule[tourIndex];
                const member = this.state.members.find(m => m.id === item.memberId) || {};
                const stats = this.getMemberStats(member.id);
                const receiptNum = `B-${String(item.tour).padStart(2,'0')}-${item.date.replace(/-/g,'')}`;
                const amendeDeduite = stats.totalFine || 0;
                const netAVerser = item.montantBouffe - amendeDeduite;
                const fraisGestion = (member.nbNoms * this.state.params.fraisNom) + (member.nbDemiNoms * this.state.params.fraisDemiNom);
                const toursRestants = 30 - item.tour;

                const modal = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');
                
                content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b pb-3">
                        <h3 class="text-sm font-bold text-gray-900">Reçu de Paiement Bénéficiaire</h3>
                        <button onclick="window.tjbsAppInstance.closeModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>

                    <div id="printable-receipt" class="bg-white border border-gray-300 rounded-xl p-4 space-y-3 text-xs text-gray-800 shadow-inner">
                        <div class="flex items-center space-x-3 border-b pb-3">
                            <div class="w-12 h-12 bg-white rounded-full flex items-center justify-center border-2 border-tjbsGold flex-shrink-0 overflow-hidden">
                                <img src="icon-96.png" alt="Logo TJBS" class="w-full h-full object-contain rounded-full">
                            </div>
                            <div>
                                <h2 class="text-xs font-extrabold text-tjbsNavy">TONTINE JOURNALIÈRE DES BATTANTS SOLIDAIRES</h2>
                                <p class="text-[9px] text-gray-500">Reçu N° ${receiptNum}</p>
                                <p class="text-[9px] text-tjbsGreen font-semibold">Devise : Épargner • S'entraider • Avancer ensemble</p>
                            </div>
                        </div>

                        <div class="space-y-1.5 text-[11px]">
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200">
                                <span class="text-gray-500">Bénéficiaire :</span>
                                <span class="font-bold">${member.nom || ''} ${member.prenom || ''} (${member.id || ''})</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200">
                                <span class="text-gray-500">N° de passage / Tour :</span>
                                <span class="font-bold">Tour #${item.tour} sur 30</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200">
                                <span class="text-gray-500">Parts :</span>
                                <span class="font-bold">${member.nbNoms || 0} Nom(s) / ${member.nbDemiNoms || 0} Demi</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200">
                                <span class="text-gray-500">Montant de la bouffe :</span>
                                <span class="font-bold text-tjbsNavy">${item.montantBouffe.toLocaleString()} FCFA</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200">
                                <span class="text-gray-500">Frais de gestion prélevés :</span>
                                <span class="font-bold">${fraisGestion.toLocaleString()} FCFA</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200">
                                <span class="text-gray-500">Amende déduite (${stats.misses || 0} échecs) :</span>
                                <span class="font-bold text-rose-600">-${amendeDeduite.toLocaleString()} FCFA</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200 bg-emerald-50 px-2 rounded">
                                <span class="font-bold text-emerald-800">Montant net versé :</span>
                                <span class="font-extrabold text-emerald-900">${netAVerser.toLocaleString()} FCFA</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200">
                                <span class="text-gray-500">Date effective / prévue :</span>
                                <span class="font-bold">${item.date}</span>
                            </div>
                            <div class="flex justify-between py-1 border-b border-dashed border-gray-200">
                                <span class="text-gray-500">Solde restant membre :</span>
                                <span class="font-bold">${stats.balanceRemaining ? stats.balanceRemaining.toLocaleString() : 0} FCFA</span>
                            </div>
                            <div class="flex justify-between py-1">
                                <span class="text-gray-500">Tours restants après ce paiement :</span>
                                <span class="font-bold">${toursRestants}</span>
                            </div>
                        </div>

                        <div class="grid grid-cols-2 gap-4 pt-3 border-t text-center text-[10px]">
                            <div>
                                <p class="text-gray-500 mb-6">Signature du Bénéficiaire</p>
                                <p class="font-bold border-t border-gray-400 pt-1">Lu et approuvé</p>
                            </div>
                            <div>
                                <p class="text-gray-500 mb-6">Signature du Gestionnaire</p>
                                <p class="font-bold border-t border-gray-400 pt-1">TJBS Officiel</p>
                            </div>
                        </div>

                        <div class="text-center pt-2 border-t text-[9px] text-gray-400">
                            Conçu par Mvagai conception • Tontine TJBS Mobile PWA
                        </div>
                    </div>

                    <div class="flex space-x-2 pt-2">
                        <button onclick="window.print()" class="flex-1 bg-tjbsGreen text-white py-2.5 rounded-xl text-xs font-semibold shadow hover:bg-tjbsDarkGreen transition flex items-center justify-center space-x-2">
                            <i class="fa-solid fa-print"></i>
                            <span>Imprimer / PDF</span>
                        </button>
                        <button onclick="window.tjbsAppInstance.closeModal()" class="bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl text-xs font-semibold hover:bg-gray-300 transition">
                            Fermer
                        </button>
                    </div>
                </div>`;

                modal.classList.remove('hidden');
            }

            openMemberModal(memberId = null) {
                const member = memberId ? this.state.members.find(m => m.id === memberId) : {
                    id: `MEM-${100 + this.state.members.length + 1}`,
                    nom: '',
                    prenom: '',
                    telephone: '+237 6',
                    quartier: '',
                    nbNoms: 1,
                    nbDemiNoms: 0,
                    statut: 'Actif'
                };

                const modal = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');

                content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b pb-3">
                        <h3 class="text-sm font-bold text-gray-900">${memberId ? 'Modifier Membre' : 'Nouveau Membre'}</h3>
                        <button onclick="window.tjbsAppInstance.closeModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>

                    <form onsubmit="window.tjbsAppInstance.saveMember(event, '${memberId || ''}')" class="space-y-3 text-xs">
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">Nom</label>
                            <input type="text" name="nom" required value="${member.nom}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 focus:bg-white focus:ring-2 focus:ring-tjbsGreen focus:outline-none">
                        </div>
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">Prénom</label>
                            <input type="text" name="prenom" required value="${member.prenom}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 focus:bg-white focus:ring-2 focus:ring-tjbsGreen focus:outline-none">
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Téléphone</label>
                                <input type="text" name="telephone" required value="${member.telephone}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 focus:bg-white focus:ring-2 focus:ring-tjbsGreen focus:outline-none">
                            </div>
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Quartier / Village</label>
                                <input type="text" name="quartier" required value="${member.quartier}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 focus:bg-white focus:ring-2 focus:ring-tjbsGreen focus:outline-none">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Nombre de Noms</label>
                                <input type="number" name="nbNoms" min="0" required value="${member.nbNoms}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 focus:bg-white focus:ring-2 focus:ring-tjbsGreen focus:outline-none">
                            </div>
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Nombre de Demi-noms</label>
                                <input type="number" name="nbDemiNoms" min="0" required value="${member.nbDemiNoms}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 focus:bg-white focus:ring-2 focus:ring-tjbsGreen focus:outline-none">
                            </div>
                        </div>
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">Statut</label>
                            <select name="statut" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2 focus:bg-white focus:ring-2 focus:ring-tjbsGreen focus:outline-none">
                                <option value="Actif" ${member.statut==='Actif'?'selected':''}>Actif</option>
                                <option value="Inactif" ${member.statut==='Inactif'?'selected':''}>Inactif</option>
                            </select>
                        </div>
                        <div class="pt-2 flex space-x-2">
                            <button type="submit" class="flex-1 bg-tjbsGreen text-white py-2.5 rounded-xl font-semibold hover:bg-tjbsDarkGreen transition">Enregistrer</button>
                            <button type="button" onclick="window.tjbsAppInstance.closeModal()" class="bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl font-semibold hover:bg-gray-300 transition">Annuler</button>
                        </div>
                    </form>
                </div>`;

                modal.classList.remove('hidden');
            }

            saveMember(event, memberId) {
                event.preventDefault();
                const form = event.target;
                const data = {
                    id: memberId || `MEM-${100 + this.state.members.length + 1}`,
                    nom: form.nom.value,
                    prenom: form.prenom.value,
                    telephone: form.telephone.value,
                    quartier: form.quartier.value,
                    nbNoms: parseInt(form.nbNoms.value) || 0,
                    nbDemiNoms: parseInt(form.nbDemiNoms.value) || 0,
                    statut: form.statut.value
                };

                if (memberId) {
                    const idx = this.state.members.findIndex(m => m.id === memberId);
                    if (idx !== -1) this.state.members[idx] = data;
                } else {
                    this.state.members.push(data);
                    this.state.dailyContributions[data.id] = {};
                }

                this.saveToLocalStorage();
                this.closeModal();
                this.renderCurrentView();
                this.showToast('Membre enregistré avec succès');
            }

            deleteMember(memberId) {
                if (window.confirm('Voulez-vous vraiment supprimer ce membre ?')) {
                    this.state.members = this.state.members.filter(m => m.id !== memberId);
                    delete this.state.dailyContributions[memberId];
                    this.saveToLocalStorage();
                    this.renderCurrentView();
                    this.showToast('Membre supprimé');
                }
            }

            openSettingsModal() {
                const p = this.state.params;
                const modal = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');

                content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b pb-3">
                        <h3 class="text-sm font-bold text-gray-900">Paramètres de la Tontine TJBS</h3>
                        <button onclick="window.tjbsAppInstance.closeModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>

                    <form onsubmit="window.tjbsAppInstance.saveSettings(event)" class="space-y-3 text-xs">
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Valeur Nom / jour (FCFA)</label>
                                <input type="number" name="valNom" required value="${p.valNom}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2">
                            </div>
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Valeur Demi-nom / jour</label>
                                <input type="number" name="valDemiNom" required value="${p.valDemiNom}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Bouffe Nom (FCFA)</label>
                                <input type="number" name="bouffeNom" required value="${p.bouffeNom}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2">
                            </div>
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Bouffe Demi-nom (FCFA)</label>
                                <input type="number" name="bouffeDemiNom" required value="${p.bouffeDemiNom}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Amende Avant (FCFA)</label>
                                <input type="number" name="amendeAvant" required value="${p.amendeAvant}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2">
                            </div>
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Amende Après (FCFA)</label>
                                <input type="number" name="amendeApres" required value="${p.amendeApres}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2">
                            </div>
                        </div>
                        <div class="grid grid-cols-2 gap-2">
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Date de début</label>
                                <input type="date" name="startDate" required value="${p.startDate}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2">
                            </div>
                            <div>
                                <label class="block font-medium text-gray-700 mb-1">Date de fin</label>
                                <input type="date" name="endDate" required value="${p.endDate}" class="w-full bg-gray-100 border border-gray-200 rounded-xl px-3 py-2">
                            </div>
                        </div>
                        <div class="pt-2 flex space-x-2">
                            <button type="submit" class="flex-1 bg-tjbsGreen text-white py-2.5 rounded-xl font-semibold hover:bg-tjbsDarkGreen transition">Enregistrer les paramètres</button>
                            <button type="button" onclick="window.tjbsAppInstance.closeModal()" class="bg-gray-200 text-gray-700 px-4 py-2.5 rounded-xl font-semibold hover:bg-gray-300 transition">Annuler</button>
                        </div>
                    </form>
                </div>`;

                modal.classList.remove('hidden');
            }

            saveSettings(event) {
                event.preventDefault();
                const form = event.target;
                this.state.params = {
                    ...this.state.params,
                    valNom: parseFloat(form.valNom.value),
                    valDemiNom: parseFloat(form.valDemiNom.value),
                    bouffeNom: parseFloat(form.bouffeNom.value),
                    bouffeDemiNom: parseFloat(form.bouffeDemiNom.value),
                    amendeAvant: parseFloat(form.amendeAvant.value),
                    amendeApres: parseFloat(form.amendeApres.value),
                    startDate: form.startDate.value,
                    endDate: form.endDate.value
                };
                this.saveToLocalStorage();
                this.closeModal();
                this.renderCurrentView();
                this.showToast('Paramètres mis à jour avec succès');
            }

            triggerImportModal() {
                const modal = document.getElementById('modal-container');
                const content = document.getElementById('modal-content');

                content.innerHTML = `
                <div class="space-y-4">
                    <div class="flex items-center justify-between border-b pb-3">
                        <h3 class="text-sm font-bold text-gray-900">Importer un fichier Excel</h3>
                        <button onclick="window.tjbsAppInstance.closeModal()" class="w-8 h-8 rounded-full bg-gray-100 text-gray-500 hover:bg-gray-200 flex items-center justify-center">
                            <i class="fa-solid fa-xmark text-xs"></i>
                        </button>
                    </div>
                    <div class="space-y-3 text-xs">
                        <p class="text-gray-600">Sélectionnez votre fichier Excel (.xlsx) contenant les onglets PARAMETRES, MEMBRES, etc.</p>
                        <input type="file" id="excel-file-input" accept=".xlsx, .xls" class="w-full bg-gray-100 border border-gray-200 rounded-xl p-3">
                        <button onclick="window.tjbsAppInstance.handleExcelImport()" class="w-full bg-tjbsGreen text-white py-2.5 rounded-xl font-semibold hover:bg-tjbsDarkGreen transition">Lancer l'importation</button>
                    </div>
                </div>`;
                modal.classList.remove('hidden');
            }

            handleExcelImport() {
                const fileInput = document.getElementById('excel-file-input');
                if (!fileInput.files || fileInput.files.length === 0) {
                    this.showToast('Veuillez sélectionner un fichier');
                    return;
                }
                const file = fileInput.files[0];
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const data = new Uint8Array(e.target.result);
                        const workbook = XLSX.read(data, { type: 'array' });
                        
                        if (workbook.Sheets['MEMBRES']) {
                            const membJson = XLSX.utils.sheet_to_json(workbook.Sheets['MEMBRES']);
                            if (membJson.length > 0) {
                                this.state.members = membJson.map((row, idx) => ({
                                    id: row['N°'] || row['ID'] || `MEM-${200+idx}`,
                                    nom: row['Nom'] || row['Nom et Prénom'] || 'Nom',
                                    prenom: row['Prénom'] || '',
                                    telephone: String(row['Téléphone'] || '+237 600000000'),
                                    quartier: row['Quartier/Village'] || row['Quartier'] || 'Centre',
                                    nbNoms: parseInt(row['Nb Noms'] || row['NbNoms'] || 1),
                                    nbDemiNoms: parseInt(row['Nb Demi-noms'] || row['NbDemiNoms'] || 0),
                                    statut: row['Statut'] || 'Actif'
                                }));
                            }
                        }
                        this.saveToLocalStorage();
                        this.closeModal();
                        this.renderCurrentView();
                        this.showToast('Import Excel réussi avec succès !');
                    } catch (err) {
                        console.error(err);
                        this.showToast('Erreur lors du parsing du fichier Excel');
                    }
                };
                reader.readAsArrayBuffer(file);
            }

            exportExcelCycle() {
                try {
                    const wb = XLSX.utils.book_new();

                    const wsParams = XLSX.utils.json_to_sheet([this.state.params]);
                    XLSX.utils.book_append_sheet(wb, wsParams, "PARAMETRES");

                    const wsMembers = XLSX.utils.json_to_sheet(this.state.members);
                    XLSX.utils.book_append_sheet(wb, wsMembers, "MEMBRES");

                    const wsBenef = XLSX.utils.json_to_sheet(this.state.beneficiarySchedule);
                    XLSX.utils.book_append_sheet(wb, wsBenef, "ORDRE BENEFICIAIRES");

                    XLSX.writeFile(wb, `TJBS_Cycle_${this.state.params.currentCycle}_Export.xlsx`);
                    this.showToast('Fichier Excel exporté avec succès');
                } catch (err) {
                    console.error(err);
                    this.showToast('Erreur lors de l\'export Excel');
                }
            }

            promptCloseCycle() {
                if (window.confirm('Voulez-vous clôturer ce cycle de 30 jours et exporter les données de fin de cycle ?')) {
                    this.exportExcelCycle();
                    this.state.params.currentCycle++;
                    this.state.dailyContributions = {};
                    this.saveToLocalStorage();
                    this.renderCurrentView();
                    this.showToast(`Cycle ${this.state.params.currentCycle - 1} clôturé. Nouveau cycle démarré !`);
                }
            }

            async openInstallPrompt() {
                if (this.deferredInstallPrompt) {
                    this.deferredInstallPrompt.prompt();
                    const { outcome } = await this.deferredInstallPrompt.userChoice;
                    if (outcome === 'accepted') {
                        this.showToast('Installation en cours...');
                    }
                    this.deferredInstallPrompt = null;
                    document.getElementById('install-btn').classList.add('hidden');
                } else {
                    this.showToast('Menu ⋮ du navigateur → "Installer l\'application" ou "Ajouter à l\'écran d\'accueil".');
                }
            }

            closeModal() {
                document.getElementById('modal-container').classList.add('hidden');
            }
        }

        // Global app instance declaration
        window.tjbsAppInstance = new TJBSApp();
    </script>
</body>
</html>
